<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
    
    <title>天草市 旅費算定地点・金額検索アプリ</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    <meta name="theme-color" content="#0056b3">

    <script src="data.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>天草市 旅費算定地点・金額検索アプリ</h1>
        <p>旅費の起点と終点を特定し、距離と金額を検索します。</p>

        <div class="search-section">
            <h2>1. 旅費の起点地点を特定</h2>
            <div class="mode-switcher start-mode-switcher">
                <button id="start-mode-address" class="active">住所から特定</button>
                <button id="start-mode-facility">施設名から特定</button>
            </div>

            <div id="start-address-form" class="search-form point-form">
                <div class="input-group">
                    <label for="start-town-name">町名 <small>(※数字が含まれる場合は漢数字で入力)</small></label>
                    <input type="text" id="start-town-name" list="town-list" placeholder="例: 五和町御領" enterkeyhint="search" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="start-house-number">地番</label>
                    <input type="text" id="start-house-number" placeholder="例: 2943 (半角数字)" enterkeyhint="search" inputmode="decimal" autocomplete="off">
                </div>
            </div>

            <div id="start-facility-form" class="search-form point-form hidden">
                <div class="input-group">
                    <label for="start-facility-select">施設名</label>
                    <select id="start-facility-select">
                        <option value="">-- 施設を選択してください --</option>
                    </select>
                </div>
            </div>
        </div>

        <hr>

        <div class="search-section">
            <h2>2. 旅費の終点地点を特定</h2>
            <div class="mode-switcher end-mode-switcher">
                <button id="end-mode-address" class="active">住所から特定</button>
                <button id="end-mode-facility">施設名から特定</button>
            </div>

            <div id="end-address-form" class="search-form point-form">
                <div class="input-group">
                    <label for="end-town-name">町名 <small>(※数字が含まれる場合は漢数字で入力)</small></label>
                    <input type="text" id="end-town-name" list="town-list" placeholder="例: 本渡町広瀬" enterkeyhint="search" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="end-house-number">地番</label>
                    <input type="text" id="end-house-number" placeholder="例: 5-110 (半角数字)" enterkeyhint="search" inputmode="decimal" autocomplete="off">
                </div>
            </div>

            <div id="end-facility-form" class="search-form point-form hidden">
                <div class="input-group">
                    <label for="end-facility-select">施設名</label>
                    <select id="end-facility-select">
                        <option value="">-- 施設を選択してください --</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="search-execute-area">
            <button id="search-execute-btn">旅費を検索</button>
        </div>
        
        <div id="result-area" class="result-box">
            <p class="result-label">特定された地点（起点 → 終点）</p>
            <p id="travel-segment-display" class="result-point">---</p>
            <hr>
            <p class="result-label">起点と終点の特定元情報</p>
            <p id="search-input-display" class="result-input">---</p>
            <hr>
            <p class="result-label">旅費 (往復金額 / 片道距離)</p>
            <p id="travel-cost-display" class="result-cost">---</p>
            <p id="note-display" class="result-note">※ 特定された地点が旅費算定の基準となります。</p>
        </div>

        <datalist id="town-list"></datalist>

    </div>
    </body>
</html>
